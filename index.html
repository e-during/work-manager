<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업무">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>Work Manager</title>
<style>
:root{--accent:#c8102e;--accent-soft:#fdeef0;--bg:#f6f7f9;--card:#fff;--text:#16181d;--sub:#4e5561;--dim:#8b929d;--muted:#b9bec6;
  --line:#eceef1;--green:#16a34a;--orange:#ea7a12;--red:#e5383b;--blue:#2f6fe4;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 10px rgba(16,24,40,.05);--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.hd{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px 18px;display:flex;align-items:center;gap:6px}
.hd-l{flex:1;min-width:0}
.ttl{font-size:20px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.sub{font-size:11px;color:var(--dim);margin-top:1px;display:flex;align-items:center;gap:4px}
.sub i{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.sub.old i{background:var(--orange)}
.ib{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--sub);display:grid;place-items:center}
.ib:active{background:#f0f1f3}
.ib svg{width:20px;height:20px}
.pill{height:30px;padding:0 11px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:12px;font-weight:700;color:var(--sub)}
.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
main{padding:12px 12px calc(var(--nav) + env(safe-area-inset-bottom) + 84px)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{position:relative;flex:1;height:var(--nav);border:0;background:none;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600}
.bnav svg{width:23px;height:23px}
.bnav button.on{color:var(--accent)}
.bnav .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:9px;font-weight:800;
  min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);z-index:11;width:54px;height:54px;
  border-radius:18px;border:0;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(200,16,46,.35);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.dim{position:fixed;inset:0;background:rgba(15,18,24,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:20px 20px 0 0;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:#dfe2e6;margin:0 auto 12px}
.sheet h4{margin:0 0 10px;font-size:16px}
.sheet .in{display:flex;gap:8px}
.sheet input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;outline:none;background:#fafbfc}
.sheet input:focus{border-color:var(--accent);background:#fff}
.sheet .go{border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;padding:0 18px;font-size:15px}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ex button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 11px;font-size:12.5px;color:var(--sub)}
.sheet p{margin:12px 2px 0;font-size:12px;color:var(--dim);line-height:1.5}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 4px 8px;font-size:13px;font-weight:700;color:var(--sub)}
.sec:first-child{margin-top:4px}
.sec.hot{color:var(--accent)}
.sec small{font-weight:600;color:var(--dim);font-size:11px}
.it{display:flex;align-items:flex-start;gap:12px;padding:12px 14px}
.it+.it,.it+.note,.note+.it,.note+.note{border-top:1px solid var(--line)}
.it .tm{font-size:13px;font-weight:700;color:var(--accent);min-width:42px;font-variant-numeric:tabular-nums;padding-top:1px}
.it .bx{width:18px;height:18px;border-radius:6px;border:1.8px solid #cfd3d9;margin:1px 2px 0 0;flex:none}
.it .bx.doing{border-color:var(--accent);background:var(--accent-soft)}
.it .tx{flex:1;min-width:0;line-height:1.42;word-break:break-all}
.it .tx small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.note{padding:12px 14px}
.note b{display:block;font-size:11px;font-weight:700;color:var(--dim);margin-bottom:4px}
.note div{white-space:pre-wrap;line-height:1.55;font-size:14px;word-break:break-all}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;background:#f1f2f4;color:var(--sub);flex:none}
.tag.red{background:#fdecec;color:var(--red)}.tag.orange{background:#fff1e3;color:var(--orange)}
.empty{padding:22px 14px;color:var(--muted);text-align:center;font-size:13px}
.banner{display:flex;gap:10px;align-items:flex-start;background:#fff8e8;border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:13px;color:#8a5a06}
.banner b{display:block;margin-bottom:2px}
.warn{background:#fdecec;color:var(--red);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:12.5px;font-weight:600}
.cal{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;touch-action:pan-y}
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 0 6px}
.wk div{text-align:center;font-size:11px;font-weight:700;color:var(--dim)}
.wk div:first-child{color:var(--red)}.wk div:last-child{color:var(--blue)}
.gd{display:grid;grid-template-columns:repeat(7,1fr)}
.c{min-height:78px;padding:4px 2px 3px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0}
.c .n{align-self:center;font-size:12.5px;font-weight:700;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-variant-numeric:tabular-nums}
.c.sun .n,.c.hol .n{color:var(--red)}.c.sat .n{color:var(--blue)}
.c.out .n,.c.out .ch{opacity:.32}
.c.today .n{background:var(--accent);color:#fff!important}
.c.sel{background:#f6f7f9}
.c.sel .n{box-shadow:inset 0 0 0 1.5px var(--text)}
.c.today.sel .n{box-shadow:none}
.ch{font-size:10px;line-height:1.3;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#f0f2f5;color:var(--sub);font-weight:600}
.ch.al{background:var(--accent-soft);color:var(--accent)}
.ch.tk{background:#fff1e3;color:var(--orange)}
.ch.hn{background:none;color:var(--red);padding:0 3px;font-size:9px}
.ch.more{background:none;color:var(--dim);padding:0 3px;font-size:9.5px}
.c{position:relative}
.c.done{background:#f0faf3}
.pg{position:absolute;top:6px;right:3px;font-size:8.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.pg.ok{color:var(--green)}.pg.carry{color:var(--orange)}
.band{font-size:9.5px;line-height:1.35;color:#fff;font-weight:700;padding:1px 4px;margin:0 -2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.c.sat .band{margin-right:0}.c.sun .band{margin-left:0}
.band.st{border-top-left-radius:4px;border-bottom-left-radius:4px;margin-left:1px}
.band.en{border-top-right-radius:4px;border-bottom-right-radius:4px;margin-right:1px}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px 4px;font-size:12.5px;font-weight:700;color:var(--sub)}
.mrow .pct{font-size:15px;font-weight:800;color:var(--text)}
.mrow .fire{color:var(--accent)}
.mbar{flex:1;height:6px;border-radius:6px;background:#eef0f3;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--green);border-radius:6px}
.mk{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.dayhd{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px;scroll-margin-top:70px}
.dayhd b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.dayhd span{font-size:12px;color:var(--dim);font-weight:600}
.dayhd .hol{color:var(--red)}
.plan{padding:16px}
.plan .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan .nm{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;min-width:0}
.plan .nm i{width:10px;height:10px;border-radius:3px;flex:none}
.plan .dd{font-size:20px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.plan .meta{font-size:12px;color:var(--dim);margin:2px 0 12px 18px}
.pb{position:relative;height:8px;background:#eef0f3;border-radius:8px}
.pb i{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.pb b{position:absolute;top:-4px;width:2px;height:16px;border-radius:1px;background:var(--text);opacity:.5}
.plan .ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-top:10px}
.plan .ph{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--sub)}
.hint{font-size:11.5px;color:var(--dim);margin:4px 6px;line-height:1.5}
.memo{padding:13px 15px;white-space:pre-wrap;line-height:1.55;font-size:14px;word-break:break-all}
.memo+.memo{border-top:1px solid var(--line)}
.memo.hi{box-shadow:inset 3px 0 0 var(--red)}
.menu{position:fixed;top:calc(env(safe-area-inset-top) + 52px);right:10px;z-index:30;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(16,24,40,.16);padding:6px;min-width:190px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:9px;font-size:14px;color:var(--text)}
.menu button:active{background:#f3f4f6}
.menu .info{padding:8px 12px 6px;font-size:11.5px;color:var(--dim);line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#1f2329;color:#fff;
  padding:11px 16px;border-radius:12px;font-size:13.5px;z-index:40;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px;background:#fff}
#login .logo{width:64px;height:64px;border-radius:18px;margin-bottom:18px}
#login h2{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.03em}
#login p{margin:0 0 26px;color:var(--dim);font-size:14px;line-height:1.5}
#login label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 6px}
#login input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:16px;outline:none;background:#fafbfc}
#login input:focus{border-color:var(--accent);background:#fff}
#login button{width:100%;margin-top:24px;border:0;background:var(--accent);color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:700}
#lmsg{color:var(--red);font-size:13px;min-height:18px;margin-top:12px;text-align:center}
</style>
</head>
<body>

<section id="login" class="hidden">
  <img class="logo" src="icon-180.png" alt="">
  <h2>Work Manager</h2>
  <p>PC 프로그램(☁ 동기화)과 같은<br>이메일·비밀번호로 로그인하세요</p>
  <label for="lemail">이메일</label>
  <input id="lemail" type="email" autocomplete="username" value="owner@work-manager.local">
  <label for="lpw">비밀번호</label>
  <input id="lpw" type="password" autocomplete="current-password">
  <button id="lbtn">로그인</button>
  <div id="lmsg"></div>
</section>

<section id="app" class="hidden">
  <header class="hd">
    <div class="hd-l">
      <div class="ttl" id="ttl">달력</div>
      <div class="sub" id="stamp"><i></i><span>불러오는 중…</span></div>
    </div>
    <div id="calnav" style="display:flex;gap:2px;align-items:center">
      <button class="ib" id="prev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="pill" id="tdy">오늘</button>
      <button class="ib" id="next" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button class="ib" id="refresh" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
    <button class="ib" id="more" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
  </header>

  <main id="main"></main>

  <button class="fab" id="fab" aria-label="적기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="bnav" id="bnav">
    <button data-v="cal" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>달력</button>
    <button data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>일정</button>
    <button data-v="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.2l2.4 2.4 4.8-5"/></svg>할 일<span class="badge hidden" id="tbadge"></span></button>
    <button data-v="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg>계획</button>
    <button data-v="memos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5M9 12.5h6M9 16h4"/></svg>메모</button>
  </nav>

  <div class="dim" id="dim"></div>
  <form class="sheet" id="sheet">
    <div class="grab"></div>
    <h4>한 줄 적기</h4>
    <div class="in">
      <input id="addin" placeholder="예: 내일 2시 공급사 회의" autocomplete="off" enterkeyhint="send">
      <button class="go" type="submit">보내기</button>
    </div>
    <div class="ex" id="ex">
      <button type="button">내일 오전 10시 </button>
      <button type="button">금요일까지 </button>
      <button type="button">다음주 월요일 </button>
      <button type="button">매주 금 4시 </button>
      <button type="button">+ 30분</button>
    </div>
    <p>PC가 켜져 있으면 15분 안에 일정·할 일로 정리돼요 (꺼져 있으면 다음에 켤 때).<br>날짜·시간 없이 적으면 할 일, "+ 내용 30분"은 한 줄 기록.</p>
  </form>
</section>

<script>
"use strict";
const SB = "https://rohkmakucihoccwyzkoa.supabase.co";
const KEY = "sb_publishable_MwI6Uxd42eY50Gq9F01zAg_hiD2MQ_h";
const BUCKET = "workmanager";
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const TITLES = { cal: "", agenda: "다가오는 일정", tasks: "할 일", plans: "계획", memos: "메모" };
const $ = (id) => document.getElementById(id);

const mem = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } },
};

let token = null, uid = store.get("wm_uid"), data = null, view = "cal", calY = null, calM = null, calSel = null, pending = [];

async function authReq(grant, body) {
  const r = await fetch(`${SB}/auth/v1/token?grant_type=${grant}`, {
    method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(grant === "password" ? "이메일 또는 비밀번호가 틀렸어요" : "login");
  token = j.access_token; uid = j.user.id;
  store.set("wm_refresh", j.refresh_token); store.set("wm_uid", uid);
}
async function ensure() {
  if (token) return;
  const rt = store.get("wm_refresh");
  if (!rt) throw new Error("login");
  await authReq("refresh_token", { refresh_token: rt });
}
async function api(method, path, body, retry = true) {
  await ensure();
  const h = { apikey: KEY, Authorization: `Bearer ${token}` };
  if (body !== undefined) h["Content-Type"] = "application/json";
  const r = await fetch(SB + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body), cache: "no-store" });
  if (r.status === 401 && retry) { token = null; return api(method, path, body, false); }
  return r;
}

async function load() {
  $("refresh").classList.add("spin");
  try {
    const r = await api("GET", `/storage/v1/object/authenticated/${BUCKET}/${uid}/mobile.json`);
    if (r.ok) data = await r.json();
    else if (r.status === 400 || r.status === 404) data = null;
    else throw new Error("오류 " + r.status);
    try { store.set("wm_cache", JSON.stringify(data)); } catch (e) {}
    await loadPending();
  } catch (e) {
    if (e.message === "login") { $("refresh").classList.remove("spin"); return showLogin(); }
    const c = store.get("wm_cache");
    if (c && !data) { try { data = JSON.parse(c); } catch (x) {} }
    toast("인터넷 연결을 확인하세요 · 저장된 화면 표시");
  }
  $("refresh").classList.remove("spin");
  render();
}
async function loadPending() {
  try {
    const r = await api("POST", `/storage/v1/object/list/${BUCKET}`, { prefix: `${uid}/inbox`, limit: 100 });
    const names = r.ok ? (await r.json()).map((o) => o.name).filter((n) => n && n.endsWith(".json")) : [];
    const sent = JSON.parse(store.get("wm_sent") || "{}");
    pending = names.sort().map((n) => sent[n] || "(휴대폰에서 적은 내용)");
    const keep = {}; names.forEach((n) => { if (sent[n]) keep[n] = sent[n]; });
    store.set("wm_sent", JSON.stringify(keep));
  } catch (e) { pending = []; }
}
async function addLine(text) {
  const now = new Date();
  const ts = `${ymd(now)}T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const name = ts.replace(/[-:T]/g, "") + "_" + Math.random().toString(36).slice(2, 8) + ".json";
  const r = await api("POST", `/storage/v1/object/${BUCKET}/${uid}/inbox/${name}`, { x: text, ts });
  if (!r.ok) throw new Error("전송 실패 " + r.status);
  const sent = JSON.parse(store.get("wm_sent") || "{}"); sent[name] = text; store.set("wm_sent", JSON.stringify(sent));
  pending.push(text);
}

const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayS = () => ymd(new Date());
const diff = (s) => Math.round((parse(s) - parse(todayS())) / 86400000);
const md = (s) => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const longDay = (s) => { const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; };
const rel = (s) => { const n = diff(s); return n === 0 ? "오늘" : n === 1 ? "내일" : n === 2 ? "모레" : n === -1 ? "어제" : n > 0 ? `${n}일 후` : `${-n}일 전`; };
function dueTag(s) {
  if (!s) return ["언젠가", ""];
  const n = diff(s);
  if (n < 0) return [`${-n}일 지남`, "red"];
  if (n === 0) return ["오늘", "red"];
  if (n === 1) return ["내일", "orange"];
  if (n <= 7) return [`D-${n}`, "orange"];
  return [md(s), ""];
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function tag(text, cls) { return el("span", "tag " + (cls || ""), text); }
function card(kids) { const c = el("div", "card"); kids.forEach((k) => c.appendChild(k)); return c; }
function evItem(e) {
  const r = el("div", "it");
  r.appendChild(el("div", "tm", e.t));
  const tx = el("div", "tx", e.x); if (e.r) tx.appendChild(el("small", null, "반복 · " + e.r)); r.appendChild(tx);
  return r;
}
function taskItem(k, withTag = true) {
  const r = el("div", "it");
  r.appendChild(el("div", "bx" + (k.k ? " doing" : "")));
  const sub = k.k ? "진행 중" : k.s === "plan_p" ? "계획" : k.s === "mobile" ? "휴대폰에서 적음" : k.s === "memo" ? "메모에서" : null;
  const tx = el("div", "tx", k.x); if (sub) tx.appendChild(el("small", null, sub)); r.appendChild(tx);
  if (withTag) { const [l, c] = dueTag(k.d); r.appendChild(tag(l, c)); }
  return r;
}
function noteItem(lab, txt) { const n = el("div", "note"); n.appendChild(el("b", null, lab)); n.appendChild(el("div", null, txt)); return n; }

function header() {
  const isCal = view === "cal";
  $("calnav").style.display = isCal ? "flex" : "none";
  $("ttl").textContent = isCal ? `${calY}년 ${calM + 1}월` : TITLES[view];
  const st = $("stamp");
  if (!data) { st.className = "sub old"; st.lastChild.textContent = "PC에서 아직 올리지 않음"; $("tbadge").classList.add("hidden"); return; }
  const ts = new Date(data.ts);
  const h = (Date.now() - ts) / 3600000;
  st.className = "sub" + (h >= 24 ? " old" : "");
  const hm = `${pad(ts.getHours())}:${pad(ts.getMinutes())}`;
  st.lastChild.textContent = `${data.dev || "PC"} · ${ymd(ts) === todayS() ? "오늘 " + hm : `${ts.getMonth() + 1}/${ts.getDate()} ${hm}`} 동기화`;
  const over = (data.tasks || []).filter((k) => k.d && diff(k.d) <= 0).length;
  $("tbadge").textContent = over; $("tbadge").classList.toggle("hidden", !over);
}
function render() {
  if (calY === null) { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); calSel = todayS(); }
  header();
  const m = $("main"); m.innerHTML = "";
  if (pending.length) {
    const b = el("div", "banner"); const t = el("div");
    t.appendChild(el("b", null, `PC로 보낼 대기 중 ${pending.length}건`));
    t.appendChild(el("div", null, pending.slice(0, 3).join(" · ") + (pending.length > 3 ? " …" : "")));
    b.appendChild(el("span", null, "⏳")); b.appendChild(t); m.appendChild(b);
  }
  if (!data) { m.appendChild(card([el("div", "empty", "PC 프로그램 ☰ 메뉴 → ⬆ 지금 올리기를 한 번 눌러 주세요")])); return; }
  const h = (Date.now() - new Date(data.ts)) / 3600000;
  if (h >= 48) m.appendChild(el("div", "warn", `${Math.floor(h / 24)}일 전 정보예요 · PC를 켜면 새로 올라옵니다`));
  ({ cal, agenda, tasks, plans, memos })[view](m);
}

function dayMap() {
  const map = {};
  const g = (d) => (map[d] = map[d] || { f: [], ev: [], tk: [] });
  (data.days || []).forEach((x) => { g(x.d).f = x.f; });
  (data.ev || []).forEach((e) => g(e.d).ev.push(e));
  (data.tasks || []).forEach((k) => { if (k.d) g(k.d).tk.push(k); });
  Object.values(map).forEach((v) => v.ev.sort((a, b) => (a.t || "").localeCompare(b.t || "")));
  return map;
}
function markMap() {
  const out = {};
  (data.marks || []).forEach((m) => {
    let d = parse(m.s); const e = parse(m.e);
    while (d <= e) {
      const k = ymd(d);
      if (!out[k]) out[k] = { c: m.c, l: m.l, st: k === m.s, en: k === m.e, show: k === m.s || d.getDay() === 0, s: m.s, e: m.e };
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    }
  });
  return out;
}
function firstLine(t) { return (t || "").split("\n").map((x) => x.replace(/^[-·•\s]+/, "").trim()).find(Boolean) || ""; }
function cal(m) {
  const map = dayMap(), hol = data.hol || {}, t = todayS();
  const box = el("div", "cal");
  const ms = data.mstat;
  if (ms && ms.pct !== null && ms.pct !== undefined && calY === new Date().getFullYear() && calM === new Date().getMonth()) {
    const r = el("div", "mrow");
    r.appendChild(el("span", null, "이달 달성"));
    r.appendChild(el("span", "pct", ms.pct + "%"));
    const b = el("div", "mbar"); const f = el("i"); f.style.width = ms.pct + "%"; b.appendChild(f); r.appendChild(b);
    if (ms.streak) r.appendChild(el("span", "fire", `🔥 ${ms.streak}일 연속`));
    box.appendChild(r);
  }
  const marks = markMap();
  const wk = el("div", "wk"); WD.forEach((x) => wk.appendChild(el("div", null, x))); box.appendChild(wk);
  const g = el("div", "gd");
  const first = new Date(calY, calM, 1);
  const start = new Date(calY, calM, 1 - first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(calY, calM + 1, 0).getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const d = ymd(dt), info = map[d] || { f: [], ev: [], tk: [] };
    const cls = ["c"];
    if (dt.getMonth() !== calM) cls.push("out");
    if (dt.getDay() === 0) cls.push("sun"); if (dt.getDay() === 6) cls.push("sat");
    if (hol[d]) cls.push("hol"); if (d === t) cls.push("today"); if (d === calSel) cls.push("sel");
    const pg = (data.prog || {})[d];
    if (pg && pg[1] && pg[0] >= pg[1] && d <= t) cls.push("done");
    const c = el("div", cls.join(" "));
    c.appendChild(el("div", "n", String(dt.getDate())));
    if (pg && pg[1]) {
      const ok = pg[0] >= pg[1];
      if (ok) c.appendChild(el("span", "pg ok", "✔"));
      else if (d < t && pg[2]) c.appendChild(el("span", "pg carry", "↪" + pg[2]));
      else if (d >= t) c.appendChild(el("span", "pg", `${pg[0]}/${pg[1]}`));
    }
    const mk = marks[d];
    if (mk) {
      const b = el("div", "band" + (mk.st ? " st" : "") + (mk.en ? " en" : ""), mk.show ? mk.l : "");
      b.style.background = mk.c; c.appendChild(b);
    }
    const chips = [];
    if (hol[d]) chips.push(["hn", hol[d]]);
    info.ev.forEach((e) => chips.push(["al", e.x]));
    info.f.forEach(([, txt]) => { const l = firstLine(txt); if (l) chips.push(["", l]); });
    info.tk.forEach((k) => chips.push(["tk", k.x]));
    const MAX = 3;
    chips.slice(0, chips.length > MAX ? MAX - 1 : MAX).forEach(([k, txt]) => c.appendChild(el("div", "ch " + k, txt)));
    if (chips.length > MAX) c.appendChild(el("div", "ch more", `+${chips.length - MAX + 1}`));
    c.onclick = () => { calSel = d; render(); setTimeout(() => { const h = $("dayhd"); if (h) h.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30); };
    g.appendChild(c);
  }
  box.appendChild(g);
  m.appendChild(box);
  let sx = null, sy = null;
  box.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  box.addEventListener("touchend", (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMonth(dx < 0 ? 1 : -1);
  });
  const info = map[calSel] || { f: [], ev: [], tk: [] };
  const hd = el("div", "dayhd"); hd.id = "dayhd";
  hd.appendChild(el("b", null, longDay(calSel)));
  hd.appendChild(el("span", null, rel(calSel)));
  if (hol[calSel]) hd.appendChild(el("span", "hol", hol[calSel]));
  const smk = marks[calSel];
  if (smk) { const k = el("span", "mk", smk.l + (smk.s !== smk.e ? ` ${md(smk.s)}~${md(smk.e)}` : "")); k.style.background = smk.c; hd.appendChild(k); }
  const spg = (data.prog || {})[calSel];
  if (spg && spg[1]) hd.appendChild(el("span", null, `☑ ${spg[0]}/${spg[1]}` + (spg[2] ? ` · ↪${spg[2]} 넘어감` : "")));
  m.appendChild(hd);
  const items = [];
  info.ev.forEach((e) => items.push(evItem(e)));
  info.f.forEach(([lab, txt]) => items.push(noteItem(lab, txt)));
  info.tk.forEach((k) => items.push(taskItem(k, false)));
  m.appendChild(card(items.length ? items : [el("div", "empty", "등록된 내용이 없어요")]));
}
function moveMonth(n) {
  calM += n; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; }
  const now = new Date();
  calSel = calY === now.getFullYear() && calM === now.getMonth() ? todayS() : ymd(new Date(calY, calM, 1));
  render();
}

function agenda(m) {
  const t = todayS(), map = dayMap();
  const over = (data.tasks || []).filter((k) => k.d && k.d < t);
  if (over.length) { m.appendChild(el("div", "sec hot", `기한 지난 할 일 ${over.length}`)); m.appendChild(card(over.map((k) => taskItem(k)))); }
  const keys = Object.keys(map).filter((d) => d >= t && diff(d) <= 30).sort();
  if (!keys.includes(t)) keys.unshift(t);
  keys.forEach((d) => {
    const info = map[d] || { f: [], ev: [], tk: [] };
    const sec = el("div", "sec" + (d === t ? " hot" : ""));
    sec.appendChild(el("span", null, (diff(d) <= 2 ? rel(d) + " · " : "") + md(d)));
    if ((data.hol || {})[d]) sec.appendChild(el("small", null, data.hol[d]));
    m.appendChild(sec);
    const items = [];
    info.ev.forEach((e) => items.push(evItem(e)));
    info.f.forEach(([lab, txt]) => items.push(noteItem(lab, txt)));
    info.tk.forEach((k) => items.push(taskItem(k, false)));
    m.appendChild(card(items.length ? items : [el("div", "empty", "일정 없음")]));
  });
}

function tasks(m) {
  const groups = [["기한 지남", (k) => k.d && diff(k.d) < 0, true], ["오늘", (k) => k.d && diff(k.d) === 0, true],
    ["이번 주", (k) => k.d && diff(k.d) > 0 && diff(k.d) <= 7], ["2주 안", (k) => k.d && diff(k.d) > 7], ["언젠가", (k) => !k.d]];
  let any = false;
  groups.forEach(([title, f, hot]) => {
    const list = (data.tasks || []).filter(f);
    if (!list.length) return;
    any = true;
    const s = el("div", "sec" + (hot ? " hot" : "")); s.appendChild(el("span", null, title)); s.appendChild(el("small", null, list.length + "개"));
    m.appendChild(s); m.appendChild(card(list.map((k) => taskItem(k))));
  });
  if (!any) m.appendChild(card([el("div", "empty", "남은 할 일이 없어요 🎉")]));
}

function plans(m) {
  if (!(data.plans || []).length) return m.appendChild(card([el("div", "empty", "진행 중인 계획이 없어요")]));
  data.plans.forEach((p) => {
    const c = el("div", "card plan");
    const n = diff(p.dd);
    const top = el("div", "top");
    const nm = el("div", "nm"); const sw = el("i"); sw.style.background = p.c; nm.appendChild(sw); nm.appendChild(el("span", null, p.n));
    top.appendChild(nm);
    const dd = el("div", "dd", n === 0 ? "D-day" : n > 0 ? `D-${n}` : `D+${-n}`); if (n >= 0 && n <= 7) dd.style.color = "var(--accent)";
    top.appendChild(dd); c.appendChild(top);
    c.appendChild(el("div", "meta", longDay(p.dd)));
    const bar = el("div", "pb"); const fill = el("i"); fill.style.width = p.pct + "%"; fill.style.background = p.c; bar.appendChild(fill);
    const mk = el("b"); mk.style.left = `calc(${Math.min(100, p.tp)}% - 1px)`; bar.appendChild(mk);
    c.appendChild(bar);
    const ft = el("div", "ft"); ft.appendChild(el("span", null, `완료 ${p.pct}%  ·  시간 ${p.tp}% 지남`));
    const v = el("span", "tag"); v.textContent = p.v; v.style.color = p.vc; ft.appendChild(v);
    c.appendChild(ft);
    if (p.ph) c.appendChild(el("div", "ph", `지금 단계 · ${p.ph}  (~${md(p.pe)})`));
    m.appendChild(c);
  });
  m.appendChild(el("div", "hint", "색 막대 = 끝낸 일 비율 · 검은 선 = 지나간 시간 비율. 막대가 선보다 짧으면 늦어지는 중이에요."));
}

function memos(m) {
  if (!(data.memos || []).length) return m.appendChild(card([el("div", "empty", "메모가 없어요")]));
  m.appendChild(card(data.memos.map((x) => el("div", "memo" + (x.pr === "높음" ? " hi" : ""), x.x))));
}

function toast(t) { const d = el("div", "toast", t); document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function showLogin() { $("app").classList.add("hidden"); $("login").classList.remove("hidden"); setTimeout(() => $("lpw").focus(), 100); }
function showApp() { $("login").classList.add("hidden"); $("app").classList.remove("hidden"); render(); load(); }
function openSheet(on) {
  $("sheet").classList.toggle("on", on); $("dim").classList.toggle("on", on);
  if (on) setTimeout(() => $("addin").focus(), 200); else $("addin").blur();
}

$("lbtn").onclick = async () => {
  $("lmsg").textContent = ""; $("lbtn").disabled = true; $("lbtn").textContent = "로그인 중…";
  try { await authReq("password", { email: $("lemail").value.trim(), password: $("lpw").value }); $("lpw").value = ""; showApp(); }
  catch (e) { $("lmsg").textContent = /fetch|network/i.test(e.message) ? "인터넷 연결을 확인하세요" : e.message; }
  $("lbtn").disabled = false; $("lbtn").textContent = "로그인";
};
$("lpw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("lbtn").click(); });
$("refresh").onclick = () => load();
$("prev").onclick = () => moveMonth(-1);
$("next").onclick = () => moveMonth(1);
$("tdy").onclick = () => { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); calSel = todayS(); render(); };
$("bnav").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v;
  [...$("bnav").children].forEach((x) => x.classList.toggle("on", x === b));
  window.scrollTo(0, 0); render();
};
$("fab").onclick = () => openSheet(true);
$("dim").onclick = () => { openSheet(false); closeMenu(); };
$("ex").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const inp = $("addin"), v = b.textContent;
  inp.value = v.startsWith("+") ? "+ " + inp.value.replace(/^\+\s*/, "") + (inp.value ? " " : "") + "30분" : v + inp.value;
  inp.focus();
};
$("sheet").onsubmit = async (e) => {
  e.preventDefault();
  const t = $("addin").value.trim(); if (!t) return;
  $("addin").disabled = true;
  try { await addLine(t); $("addin").value = ""; openSheet(false); toast("보냈어요 · PC가 일정/할 일로 정리합니다"); render(); }
  catch (x) { toast(x.message === "login" ? "다시 로그인해 주세요" : "보내기 실패 · 인터넷을 확인하세요"); }
  $("addin").disabled = false;
};
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; $("dim").classList.remove("on"); } }
$("more").onclick = () => {
  if (menuEl) return closeMenu();
  menuEl = el("div", "menu");
  const ts = data ? new Date(data.ts) : null;
  const info = el("div", "info", ts ? `${data.dev || "PC"}에서 ${ts.getMonth() + 1}/${ts.getDate()} ${pad(ts.getHours())}:${pad(ts.getMinutes())}에 올린 정보` : "아직 받은 정보 없음");
  const r = el("button", null, "새로고침"); r.onclick = () => { closeMenu(); load(); };
  const o = el("button", null, "로그아웃");
  o.onclick = () => { closeMenu(); if (!confirm("로그아웃할까요?")) return; ["wm_refresh", "wm_uid", "wm_cache"].forEach((k) => store.del(k)); token = null; data = null; showLogin(); };
  menuEl.append(info, r, o); document.body.appendChild(menuEl); $("dim").classList.add("on");
};
document.addEventListener("visibilitychange", () => { if (!document.hidden && store.get("wm_refresh")) load(); });

if (store.get("wm_refresh")) {
  const c = store.get("wm_cache"); if (c) { try { data = JSON.parse(c); } catch (e) {} }
  showApp();
} else showLogin();
</script>
